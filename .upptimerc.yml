# Change these first
owner: cliffordwhansen
repo: upptime

secrets:
  - NOTIFICATION_DISCORD
  - NOTIFICATION_DISCORD_WEBHOOK_URL

sites:
  - name: Requests
    url: https://requests.nighthawk.co.za/login
  - name: Plex
    url: https://plex.nighthawk.co.za
    expectedStatusCodes:
      - 401
  - name: Jellyfin
    url: https://jellyfin.nighthawk.co.za/web/
  - name: Minecraft
    url: https://minecraft.nighthawk.co.za

  - name: Requests IPv6
    url: https://requests.nighthawk.co.za/login
    ipv6: true
  - name: Plex IPv6
    url: https://plex.nighthawk.co.za
    expectedStatusCodes:
      - 401
    ipv6: true
  - name: Jellyfin IPv6
    url: https://jellyfin.nighthawk.co.za/web/
    ipv6: true
  - name: Minecraft IPv6
    url: https://minecraft.nighthawk.co.za
    ipv6: true

assignees:
  - cliffordwhansen
status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.nighthawk.co.za
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This is a status page to see if any of my services are down
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
