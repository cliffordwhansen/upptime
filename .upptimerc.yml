assignees:
  - cliffordwhansen

status-website:
  cname: status.nighthawk.co.za
  name: NiGhTHawK Status Page
  theme: dark
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  customCSS: |
    /* Selects the section grid wrapper */
    section.live-status {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 16px !important;
      margin-top: 16px !important; /* Pushes the entire section down cleanly */
    }

    /* Standardizes spacing on the custom article components */
    section.live-status article.up {
      margin-bottom: 0 !important;
      margin-top: 0 !important;
    }

    /* Switches back to a single column list layout on mobile viewports */
    @media (max-width: 768px) {
      section.live-status {
        grid-template-columns: 1fr !important;
      }
    }
